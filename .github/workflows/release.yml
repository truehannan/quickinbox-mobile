name: Android Release APK

# Builds a release APK for the Android client and uploads it as a workflow
# artifact. Runs on pushes of version tags (v*), and can be triggered manually.
#
# Signing is optional and comes entirely from repository secrets so that no
# keystore, password, or alias is ever committed. When the signing secrets are
# present the release APK is signed with the provided keystore; otherwise an
# unsigned release APK is produced (app/build.gradle.kts tolerates a missing
# keystore and simply leaves the release build unsigned).
#
# Optional secrets:
#   ANDROID_KEYSTORE_BASE64    base64-encoded release keystore (.jks/.keystore)
#   ANDROID_KEYSTORE_PASSWORD  keystore (store) password
#   ANDROID_KEY_ALIAS          key alias inside the keystore
#   ANDROID_KEY_PASSWORD       key password for the alias

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode signing keystore (optional)
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "keystore_path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Keystore provided: building a signed release APK."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No keystore secret provided: building an unsigned release APK."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace \
              -PquickInboxStoreFile="$KEYSTORE_PATH" \
              -PquickInboxStorePassword="$ANDROID_KEYSTORE_PASSWORD" \
              -PquickInboxKeyAlias="$ANDROID_KEY_ALIAS" \
              -PquickInboxKeyPassword="$ANDROID_KEY_PASSWORD"
          else
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          fi

      - name: List release outputs
        run: ls -R app/build/outputs/apk/release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: quickinbox-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
